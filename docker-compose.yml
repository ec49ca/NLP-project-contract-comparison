version: "3.8"

services:
  # neo4j:
  #   image: neo4j:5.19-community
  #   ports:
  #     - "7474:7474" # HTTP
  #     - "7687:7687" # Bolt
  #   environment:
  #     # TODO: more secure password
  #     - NEO4J_AUTH=neo4j/samvidneo4j # username=neo4j, password=samvidneo4j
  #   volumes:
  #     - neo4j_data:/data
  #   networks:
  #     - mcp-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "cypher-shell -u neo4j -p samvidneo4j 'RETURN 1'"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  mcp-server:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=samvidneo4j
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/samvid}
      - SAMVID_API_URL=${SAMVID_API_URL:-http://host.docker.internal:3000/api}
      - PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./generated_tools:/app/generated_tools
      - ./logs:/app/logs
      - ./sunworld_test_data:/app/sunworld_test_data
    # depends_on:
    # neo4j:
    #   condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp-network

  # Optional: Local PostgreSQL for development
  # db:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_DB=samvidneo4j
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=password
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - mcp-network

volumes:
  postgres_data:
  neo4j_data:

networks:
  mcp-network:
    driver: bridge
