  mcp-server:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=samvidneo4j
      # - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/samvid}
      - POSTGRES_DATABASE_URL=postgres://postgres:postgres@samvid-postgres:5432/samvid-db
      - SAMVID_API_URL=${SAMVID_API_URL:-http://host.docker.internal:3000/api}
      - PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./generated_tools:/app/generated_tools
      - ./logs:/app/logs
      - ./sunworld_test_data:/app/sunworld_test_data
    # depends_on:
    # neo4j:
    #   condition: service_healthy
    restart: unless-stopped
    networks:
      - samvid-network

