[pytest]
testpaths = tests
python_files = test_*.py

# Test markers for categorization
markers =
    config: Configuration and settings tests
    server: Server endpoint and API tests
    llm: LLM service and provider tests
    agents: Agent functionality tests
    unit: Unit tests (isolated component tests)
    integration: Integration tests (multi-component tests)
    tools: Agent tools tests
    registry: Registry system tests
    services: Service layer tests

# Async support
asyncio_mode = auto